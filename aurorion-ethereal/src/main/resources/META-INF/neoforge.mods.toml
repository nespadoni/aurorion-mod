modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/netospadoni/aurorion-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Dependencia deliberadamente OPCIONAL, nao obrigatoria: o Altar de Selecao mora no mod de conteudo,
# mas este mod nunca referencia a classe dele — casa pela tag aurorion_ethereal:house_altars, e a
# entrada do altar na tag e marcada "required: false". Assim da para desligar o aurorion_aeonita sem
# este mod deixar de carregar, e qualquer bloco pode virar altar so entrando na tag.
[[dependencies.${mod_id}]]
modId = "aurorion_aeonita"
type = "optional"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

# Biblioteca compartilhada do ecossistema. Obrigatoria: sem ela este mod nao carrega.
# Ordering AFTER garante que o core ja esteja pronto quando este mod inicializar.
[[dependencies.${mod_id}]]
modId = "aurorion_core"
type = "required"
versionRange = "[0.6.0,)"
ordering = "AFTER"
side = "BOTH"

# Cofre da Casa: lido por reflexao, entao continua opcional. Mas quando a economia estiver no pack
# precisa ser a que tem deposito/saque pela carteira e salario; uma versao velha aqui e erro de
# carregamento, e nao um cofre que aparece desligado sem explicacao.
[[dependencies.${mod_id}]]
modId = "aurorion_economia"
type = "optional"
versionRange = "[0.3.0,)"
ordering = "NONE"
side = "BOTH"
