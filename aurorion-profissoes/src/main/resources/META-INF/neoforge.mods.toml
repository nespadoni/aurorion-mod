modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

# 0.6.7: CharacterAbilities (a profissao na aba Habilidades da ficha).
# 0.6.8: CharacterSheet, SkillTreeGate e SheetCheck (teste de fabricacao).
[[dependencies.${mod_id}]]
modId = "aurorion_core"
type = "required"
versionRange = "[0.6.8,)"
ordering = "AFTER"
side = "BOTH"

# Atendimentos presenciais aparecem exclusivamente no menu Shift+G da Economia.
[[dependencies.${mod_id}]]
modId = "aurorion_economia"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

# A tela dos NPCs de ofício é HTML/CSS do TesseraUI. Só o cliente desenha; o servidor nunca carrega classe dele.
[[dependencies.${mod_id}]]
modId = "tesseraui"
type = "required"
versionRange = "[1.1,)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "aurorion_profissoes.mixins.json"

[[mixins]]
config = "aurorion_profissoes.lso.mixins.json"
requiredMods = ["legendarysurvivaloverhaul"]

[[mixins]]
config = "aurorion_profissoes.quality.mixins.json"
requiredMods = ["quality_food"]

[[mixins]]
config = "aurorion_profissoes.spoil.mixins.json"
requiredMods = ["foodspoil"]

# Teste de oficio nas maquinas do Create (processamento e crafter mecanico).
[[mixins]]
config = "aurorion_profissoes.create.mixins.json"
requiredMods = ["create"]

# Teste de oficio nas estacoes de outros mods em que o jogador retira o resultado (alvos @Pseudo: mod
# ausente so deixa o alvo dele sem efeito).
[[mixins]]
config = "aurorion_profissoes.compat.mixins.json"
