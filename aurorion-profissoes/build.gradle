apply from: "$rootDir/gradle/aurorion-mod.gradle"

// O Shift+G da Economia e a unica entrada dos atendimentos presenciais.
evaluationDependsOn(':aurorion-economia')

neoForge {
    mods {
        create('aurorion_economia') {
            sourceSet project(':aurorion-economia').sourceSets.main
        }
    }
}

// O TesseraUI vem da pasta de referencia, como no aurorion-diario: o que compila e o que roda no
// pack sao o mesmo arquivo. Outro caminho com -PtesseraUiJar=C:/caminho/tesseraui.jar.
def referencia = { String propriedade, String arquivo ->
    files(providers.gradleProperty(propriedade).orElse("$rootDir/mod-servidor-referencia/$arquivo").get())
}

// Jars opcionais somente para validar o pack local, sem embutir dependencias no artefato.
dependencies {
    implementation project(':aurorion-economia').sourceSets.main.output
    // A tela dos NPCs e HTML/CSS do Tessera: runtime exclusivo dos runs de cliente.
    clientModLibraries referencia('tesseraUiJar', 'tesseraui-1.1.jar')
    ['lsoJar', 'qualityFoodJar', 'foodSpoilJar'].each { key ->
        if (providers.gradleProperty(key).isPresent()) {
            runtimeOnly files(providers.gradleProperty(key).get())
        }
    }
}

sourceSets { gameTest }
configurations.gameTestImplementation.extendsFrom(configurations.implementation)
configurations.gameTestCompileOnly.extendsFrom(configurations.compileOnly)
configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
neoForge {
    addModdingDependenciesTo sourceSets.gameTest
    mods { create('aurorion_profissoes_tests') { sourceSet sourceSets.gameTest } }
    runs {
        client { loadedMods = [mods.aurorion_profissoes, mods.aurorion_economia, mods.aurorion_core] }
        server { loadedMods = [mods.aurorion_profissoes, mods.aurorion_economia, mods.aurorion_core] }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'aurorion_profissoes_tests'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}
dependencies { gameTestImplementation sourceSets.main.output }
