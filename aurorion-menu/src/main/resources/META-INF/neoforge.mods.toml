modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/netospadoni/aurorion-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 0.6.9: CharacterMenu (o registro de secoes), MenuUi, EmotecraftBridge e IrisShadowPass.
[[dependencies.${mod_id}]]
modId = "aurorion_core"
type = "required"
versionRange = "[0.6.9,)"
ordering = "AFTER"
side = "BOTH"

# Opcional: a meditacao toca o emote "Meditar" por ele; sem ele, a pose sentada e desenhada pelo proprio mod.
[[dependencies.${mod_id}]]
modId = "emotecraft"
type = "optional"
versionRange = "[2.4,)"
ordering = "NONE"
side = "BOTH"
