modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/netospadoni/aurorion-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# So mexe em Component/Entity/comandos do lado do servidor (mais o mixin comum de nome do
# jogador). Um cliente sem o mod entra num servidor com ele sem problema.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Biblioteca compartilhada do ecossistema. Obrigatoria: sem ela este mod nao carrega.
# Ordering AFTER garante que o core ja esteja pronto quando este mod inicializar.
[[dependencies.${mod_id}]]
modId = "aurorion_core"
type = "required"
versionRange = "[0.5.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "${mod_id}.mixins.json"

# Rede de seguranca do LivingDeathEvent, separada e nao obrigatoria: ela mexe numa linha do
# NeoForge (CommonHooks.onLivingDeath), e se uma versao futura mudar essa linha o jogo tem de
# subir do mesmo jeito, so sem a rede. Ver DeathListenerGuardMixin.
[[mixins]]
config = "${mod_id}.deathguard.mixins.json"

# Correcoes no telefone Mattupolis do lado servidor, separadas e nao obrigatorias pelo mesmo motivo:
# se uma atualizacao do telefone mudar os metodos, o servidor sobe com o comportamento original.
# PhoneNumberStoreMixin tira do tick a gravacao do diretorio de numeros (crash do Watchdog no login);
# PhoneCallGroupMixin poe as ligacoes em grupo aberto do Voice Chat.
[[mixins]]
config = "${mod_id}.phone.mixins.json"

# Opcional. Com ele: so grupos de voz abertos, /gritar e ligacoes do telefone audiveis por perto.
# Sem ele, o /gritar continua existindo, mas nao tem efeito.
[[dependencies.${mod_id}]]
modId = "voicechat"
type = "optional"
versionRange = "1.21.1-2.5.0"
ordering = "NONE"
side = "BOTH"
