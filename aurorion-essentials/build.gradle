apply from: "$rootDir/gradle/aurorion-mod.gradle"

// Simple Voice Chat: a API vem dentro do jar do mod, do mesmo arquivo de referencia que o
// aurorion-magia usa (no aurorion-runs e o mesmo jar, carregado uma vez so). Opcional em runtime —
// o plugin de voz (voice/EssentialsVoicePlugin) so e carregado pelo proprio Voice Chat. Aponte para
// outro arquivo com -PvoicechatJar=C:/caminho/arquivo.jar.
dependencies {
    modLibraries files(providers.gradleProperty('voicechatJar')
            .orElse("$rootDir/mod-servidor-referencia/voicechat-neoforge-1.21.1-2.6.24.jar").get())
}

// O reset dos dados do telefone (extrato do banco, teto de PIX do dia, agenda de contas e numero)
// e testado fora do JUnit: o RunPhoneResetTests compila o MattupolisPhoneCompat contra stubs das
// classes de Minecraft, porque carregar a classe de verdade arrastaria o FML inteiro para dentro do
// teste so para reescrever um .properties.
//
// A tarefa existe porque o teste sozinho nao rodava em build nenhum: ficava no repositorio como um
// arquivo que alguem precisava lembrar de executar na mao. Preso ao 'check', uma regressao no reset
// quebra o build em vez de aparecer no servidor.
def phoneResetLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

def phoneResetMarker = layout.buildDirectory.file('phone-reset-test.ok')

tasks.register('phoneResetTest', Exec) {
    group = 'verification'
    description = 'Regressao do reset de dados do telefone (banco, PIX, contatos e numero).'

    // O launcher roda da raiz do monorepo porque o RunPhoneResetTests resolve os fontes por
    // caminho relativo ('aurorion-essentials/src/...').
    workingDir = rootProject.projectDir
    executable = phoneResetLauncher.get().executablePath.asFile.absolutePath
    args 'aurorion-essentials/src/test/phone-reset/RunPhoneResetTests.java'

    inputs.file('src/test/phone-reset/RunPhoneResetTests.java')
    inputs.file('src/main/java/com/aurorion/essentials/compat/MattupolisPhoneCompat.java')
    inputs.file('src/test/java/com/aurorion/essentials/compat/MattupolisPhoneCompatDataTest.java')
    outputs.file(phoneResetMarker)

    doLast {
        def marker = phoneResetMarker.get().asFile
        marker.parentFile.mkdirs()
        marker.text = 'ok'
    }
}

tasks.named('check') { dependsOn 'phoneResetTest' }
