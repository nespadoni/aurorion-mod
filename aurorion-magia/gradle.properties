mod_id=aurorion_magia
mod_name=Aurorion Magia
mod_version=0.1.0
mod_description=Addon do Iron's Spells 'n Spellbooks para o Aurorion. Nenhuma magia vem liberada: a staff libera magias ou escolas inteiras por personagem (/aurorion spells), e o estado e espelhado no Iron's Restrictions. Traz dezessete magias autorais de captura, controle, movimento e mundo, tres delas proibidas (Tempus Sistere, Mortem Dico e Dolor Universus: sem craft, sem loot, so por concessao da staff), com selos e particulas desenhados no cliente.

# O aurorion-runs sobe todos os mods do monorepo juntos, e este exige o Iron's Spells (com Curios,
# GeckoLib, PlayerAnimator e Caelus) que o run do ecossistema nao carrega. Fica de fora dele; a
# validacao e feita no pack do servidor.
aurorion_runs_skip=true
