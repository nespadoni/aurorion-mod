mod_id=aurorion_magia
mod_name=Aurorion Magia
mod_version=0.1.0
mod_description=Addon do Iron's Spells 'n Spellbooks para o Aurorion. Nenhuma magia vem liberada: a staff libera magias ou escolas inteiras por personagem (/aurorion spells), e o estado e espelhado no Iron's Restrictions. Traz duas magias autorais: Dolor Cruciatus (sangue, canalizada, dor que paralisa) e Imperium Mentis (dominio da mente de mobs e desorientacao de jogadores).

# O aurorion-runs sobe todos os mods do monorepo juntos, e este exige o Iron's Spells (com Curios,
# GeckoLib, PlayerAnimator e Caelus) que o run do ecossistema nao carrega. Fica de fora dele; a
# validacao e feita no pack do servidor.
aurorion_runs_skip=true
