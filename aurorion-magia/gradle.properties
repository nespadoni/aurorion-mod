mod_id=aurorion_magia
mod_name=Aurorion Magia
mod_version=0.5.1
mod_description=Addon do Iron's Spells 'n Spellbooks para o Aurorion. Nenhuma magia vem liberada: a staff libera magias ou escolas inteiras por personagem (/aurorion spells), e o estado e espelhado no Iron's Restrictions. Traz cinquenta e duas magias autorais de captura, controle, movimento, mundo e combate - entre elas kits inspirados em campeoes, a Esfera Espiritual e a Possessao -, nove delas proibidas (sem craft, sem loot, so por concessao da staff), com selos e particulas desenhados no cliente.
