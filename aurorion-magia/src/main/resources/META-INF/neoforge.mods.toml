modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/netospadoni/aurorion-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# Sem displayTest IGNORE: as magias e os efeitos entram em registros sincronizados com o cliente
# (o de magias do Iron's e o de MobEffect do vanilla). Cliente sem o mod nao consegue entrar.

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "aurorion_core"
type = "required"
versionRange = "[0.4.0,)"
ordering = "AFTER"
side = "BOTH"

# AFTER: o registro de magias do Iron's precisa existir antes de o nosso DeferredRegister apontar para ele.
[[dependencies.${mod_id}]]
modId = "irons_spellbooks"
type = "required"
versionRange = "1.21.1-3.16.0"
ordering = "AFTER"
side = "BOTH"

# Opcional. Sem ele o bloqueio continua valendo (o gate de conjuracao e nosso); com ele, o livro de
# pesquisa, o scroll e a inscricao passam a mostrar como "nao aprendida" toda magia nao liberada.
[[dependencies.${mod_id}]]
modId = "irons_restrictions"
type = "optional"
versionRange = "1.21.1-5.2.0"
ordering = "AFTER"
side = "BOTH"

# Opcional. Com ele, Genua Flecte forca a pose de joelhos (emote embutido no nosso jar); sem ele, o
# ajoelhado fica agachado.
[[dependencies.${mod_id}]]
modId = "emotecraft"
type = "optional"
versionRange = "[2.4.0,)"
ordering = "NONE"
side = "BOTH"

# Opcional. Com ele, Vox Interdicta corta o microfone do alvo; sem ele, corta so o chat e a magia.
[[dependencies.${mod_id}]]
modId = "voicechat"
type = "optional"
versionRange = "1.21.1-2.5.0"
ordering = "NONE"
side = "BOTH"

# Opcional. O Tempus Sistere congela com o freeze do /freeze (efeito aurorion_utils:congelado: montaria,
# teclado zerado, acoes recusadas). Sem ele, cai na estase deste mod, que so tira andar e pular.
[[dependencies.${mod_id}]]
modId = "aurorion_utils"
type = "optional"
versionRange = "[0.1.0,)"
ordering = "NONE"
side = "BOTH"
