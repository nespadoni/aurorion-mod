mod_description=Identidade de personagem do Aurorion. Quem entra pela primeira vez escolhe nome e sobrenome numa tela, e esse nome passa a ser o nome exibido no jogo. Quando um personagem morre em definitivo, a conta continua valida: a mesma pessoa cria outro personagem, com outro nome, e comeca do zero — inventario, vidas, casa, passes e progressao sao apagados antes do novo personagem existir.
