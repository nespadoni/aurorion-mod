# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge (compartilhado por todos os mods Aurorion)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.248
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment: nomes de parametros/javadoc nos mappings do Mojang
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# GeckoLib: motor de animacao usado pela capa de uniforme do aurorion-aeonita.
# Instalado no servidor/modpack como mod separado, nao empacotado no jar.
geckolib_version=4.9.2

# Identidade comum
mod_group_id=com.aurorion
mod_authors=Spadoni
mod_license=LGPL-3.0-or-later
