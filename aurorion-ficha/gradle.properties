mod_id=aurorion_ficha
mod_name=Aurorion Ficha
mod_version=0.3.0
mod_description=A ficha de RPG do site dentro do jogo: /ficha (ou a tecla da ficha, padrão a tecla à esquerda do 1) abre a ficha do personagem em HTML/CSS (TesseraUI) para ver recursos, atributos, pericias e tecnicas e rolar testes pelo motor oficial do site. O mestre pede testes aos jogadores proximos e acompanha as respostas ao vivo; alts escolhem qual ficha (ou NPC) usam. Cliente sem o mod usa comandos com linhas clicaveis no chat.
