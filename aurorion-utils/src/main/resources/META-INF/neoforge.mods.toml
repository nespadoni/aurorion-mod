modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/netospadoni/aurorion-mod/issues"

[[mixins]]
config = "aurorion_utils.mixins.json"

# Otimizacoes do Copycats+ (crash do mesher, aviso inutil no cliente). So com o Copycats no pack.
[[mixins]]
config = "aurorion_utils.copycats.mixins.json"
requiredMods = ["copycats"]

# Ordem do teste de face escondida no Sodium. So com o Sodium no pack.
[[mixins]]
config = "aurorion_utils.sodium.mixins.json"
requiredMods = ["sodium"]

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# Ao contrario do aurorion-essentials, este mod tem lado cliente de verdade (entidade + renderer
# do feixe de abducao) — cliente e servidor precisam estar pareados, sem IGNORE_ALL_VERSION.

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Biblioteca compartilhada do ecossistema. Obrigatoria: sem ela este mod nao carrega.
# Ordering AFTER garante que o core ja esteja pronto quando este mod inicializar.
[[dependencies.${mod_id}]]
modId = "aurorion_core"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"
