mod_description=Controle de acesso as dimensoes por horario. Toda dimensao fora da lista livre fica trancada; o acesso abre em janelas agendadas por datapack (as "linhas de trem"), com avisos automaticos antes da partida. Quem esta dentro quando a janela fecha fica preso — inclusive ao morrer.
