modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/netospadoni/aurorion-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# Registra blocos e itens de verdade: cliente e servidor precisam estar pareados (o cliente sem o
# mod nao teria os modelos nem os ids), entao nada de IGNORE_ALL_VERSION aqui.

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Biblioteca compartilhada do ecossistema. Obrigatoria: sem ela este mod nao carrega.
# Ordering AFTER garante que o core ja esteja pronto quando este mod inicializar.
[[dependencies.${mod_id}]]
modId = "aurorion_core"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

# Motor de animacao da capa de uniforme. Obrigatorio nos dois lados: a classe do item implementa
# GeoItem, entao sem o GeckoLib no classpath este mod nao carrega nem no servidor dedicado.
#
# A consequencia e assumida e vale registrar: o Altar de Selecao mora neste mod, entao um pack sem
# GeckoLib perde tambem o altar — e, com ele, a porta de entrada da escolha de casa do
# aurorion-ethereal. Nao e uma quebra do isolamento entre mods (o Ethereal continua carregando e
# fala com o altar por tag, nunca por import), mas e um mod a mais na lista de "tem que estar la".
[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[4.7,5.0)"
ordering = "AFTER"
side = "BOTH"
