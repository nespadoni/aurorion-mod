modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/netospadoni/aurorion-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# Registra blocos e itens de verdade: cliente e servidor precisam estar pareados (o cliente sem o
# mod nao teria os modelos nem os ids), entao nada de IGNORE_ALL_VERSION aqui.

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Biblioteca compartilhada do ecossistema. Obrigatoria: sem ela este mod nao carrega.
# Ordering BEFORE garante que o core ja esteja pronto quando este mod inicializar.
[[dependencies.${mod_id}]]
modId = "aurorion_core"
type = "required"
versionRange = "[0.1.0,)"
ordering = "BEFORE"
side = "BOTH"
