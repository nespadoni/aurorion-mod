mod_name=Aurorion Limbo
mod_version=0.4.2
mod_description=A dimensao de exilio do Aurorion e o prazo que corre dentro dela. Quem zera as vidas cai no Limbo e tem um prazo em horas reais para ser resgatado. Nas ultimas horas, se ninguem apareceu, caminhar o bastante pode revelar a Porta do Esquecido — uma saida que fica registrada na auditoria para a staff. Reporta o estado do Limbo em texto estavel, para leitura por RCON.
