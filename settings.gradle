pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    // Baixa automaticamente um JDK 21 caso a maquina nao tenha um compativel.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'aurorion-mod'

// Biblioteca compartilhada: nao adiciona nada ao jogo, mas todos os mods abaixo dependem dela.
include 'aurorion-core'

// Cada mod do ecossistema Aurorion e um subprojeto independente.
// Para adicionar um novo mod: crie a pasta com um build.gradle de uma linha
// (apply from: "$rootDir/gradle/aurorion-mod.gradle") e inclua a linha aqui.
include 'aurorion-talk'
include 'aurorion-essentials'
include 'aurorion-utils'
include 'aurorion-aeonita'
include 'aurorion-ethereal'
include 'aurorion-areas'
include 'aurorion-profissoes'
include 'aurorion-portais'
include 'aurorion-mundos'
include 'aurorion-vidas'
include 'aurorion-limbo'
include 'aurorion-personagem'
include 'aurorion-economia'
include 'aurorion-magia'

// Nao e um mod: sobe um client/servidor com todos os mods acima de uma vez.
include 'aurorion-runs'
