mod_description=A moeda do Aurorion: o Obolo e o Fragmento (1 obolo = 10 fragmentos). Guarda o saldo de cada personagem, move dinheiro entre jogadores com /pagar, e liga o app de banco do celular a esse saldo — sem o qual o banco do telefone fica desligado por nao ter economia instalada. O saldo e do personagem, nao da conta: morte definitiva zera.
