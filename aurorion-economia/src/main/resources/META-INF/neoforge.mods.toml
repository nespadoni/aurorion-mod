modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/netospadoni/aurorion-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# Um cliente sem o mod ainda pode entrar, mas o menu Shift+G e as confirmacoes visuais exigem o
# modulo nos dois lados; comandos administrativos continuam funcionando somente no servidor.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Persistencia por UUID e o evento de morte definitiva do personagem vem do core.
[[dependencies.${mod_id}]]
modId = "aurorion_core"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

# O app de banco do celular so liga se o telefone estiver instalado; sem ele o mod vive dos comandos.
[[dependencies.${mod_id}]]
modId = "mattupolis_phone"
type = "optional"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "${mod_id}.mixins.json"
