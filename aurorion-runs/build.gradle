// Projeto so de execucao: nao registra mod nenhum e nao vira jar de release.
// Existe para subir UM client (ou servidor) com todos os mods do ecossistema
// carregados de uma vez, lendo direto as classes compiladas de cada subprojeto
// -- sem buildar jar e sem copiar nada para uma pasta mods/.
plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

// Os mods do ecossistema sao todos os subprojetos menos este. Um mod novo
// incluido no settings.gradle da raiz entra aqui sozinho.
def otherProjects = rootProject.subprojects.findAll { it != project }

// Abaixo lemos sourceSets, mod_id e aurorion_runs_skip dos outros subprojetos
// em tempo de configuracao, entao eles precisam estar avaliados antes deste
// projeto (a ordem alfabetica sozinha nao garante isso).
otherProjects.each { evaluationDependsOn(it.path) }

// Excecao: quem declara aurorion_runs_skip=true no proprio gradle.properties. Serve para um mod que
// exige mod de terceiros que ainda nao esta declarado em 'modLibraries' — com ele aqui, o FML
// recusaria abrir o run inteiro por dependencia obrigatoria ausente. Hoje ninguem usa: o
// aurorion-magia, que usava, passou a declarar o Iron's e toda a arvore dele (irons_lib, Curios,
// PlayerAnimator) em 'modLibraries', a partir dos jars de mod-servidor-referencia/.
def modProjects = otherProjects.findAll { it.findProperty('aurorion_runs_skip') != 'true' }

configurations {
    clientModLibraries {
        canBeResolved = true
        canBeConsumed = false
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    // Um mod declarado por subprojeto, apontando para o sourceSet do dono.
    // O MDG aceita sourceSet de outro projeto: ele descobre o projeto dono
    // varrendo rootProject.allprojects (RunUtils.findSourceSetProject).
    mods { modContainer ->
        modProjects.each { modProject ->
            modContainer.create(modProject.property('mod_id')) { mod ->
                mod.sourceSet modProject.sourceSets.main
            }
        }
    }

    runs {
        // Sem loadedMods explicito: o default de um run e "todos os mods
        // declarados neste projeto", que aqui ja sao todos os do ecossistema.
        client {
            client()
            programArgument '--username'
            programArgument 'Dev1'
        }
        // Segundo cliente, para testar o que so acontece entre dois jogadores:
        // balao de fala, /abduzir, /fakename, sussurro, escolha de casa no altar.
        //
        // O --username diferente nao e cosmetico: o servidor de dev roda em
        // offline-mode e deriva o UUID do nome, entao dois clientes com o mesmo
        // nome sao o MESMO jogador -- o segundo a conectar chuta o primeiro.
        client2 {
            client()
            programArgument '--username'
            programArgument 'Dev2'
        }
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            if (it.name == 'client' || it.name == 'client2') {
                additionalRuntimeClasspathConfiguration.extendsFrom(configurations.clientModLibraries)
            }
            // Um diretorio por run: client, client2 e server nao dividem mundo,
            // options.txt nem log. Sem isso os dois clientes brigam pelos mesmos
            // arquivos de config.
            gameDirectory = project.file("run/${it.name}")
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Entram no classpath do run os diretorios de saida (classes + resources
    // ja processados) de cada mod, e nao o jar via project(':aurorion-x').
    // Com o jar, o FML acharia cada mod duas vezes: uma pelo jar do classpath
    // e outra pelo diretorio anunciado em -Dfml.modFolders.
    modProjects.each { modProject ->
        implementation modProject.sourceSets.main.output

        // O output acima e so classes + resources: nao traz as dependencias do mod junto.
        // As bibliotecas de terceiros que ele precisa em runtime (GeckoLib, por exemplo) vem
        // desta configuration, declarada na convencao compartilhada. Mod sem biblioteca
        // externa contribui com um conjunto vazio, entao isto nao precisa de 'if'.
        implementation files(modProject.configurations.modLibraries)
        clientModLibraries files(modProject.configurations.clientModLibraries)
    }
}

// Nada aqui e publicavel; o jar vazio deste projeto so atrapalharia.
tasks.named('jar', Jar).configure {
    enabled = false
}
